# .github/workflows/security.yml
# Scansione di sicurezza automatica: segreti, dipendenze, analisi statica.
# Le action sono bloccate al commit (SHA di 40 caratteri, con la versione accanto): un tag si può
# spostare, un commit no. Dependabot ("github-actions") propone gli aggiornamenti.
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # ogni notte alle 03:00 UTC

# Il minimo per tutti; i job che ne hanno bisogno chiedono di più.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Scansione segreti (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Su repository di un'organizzazione gitleaks-action chiede il segreto GITLEAKS_LICENSE
      # (gratuito); in alternativa usare la CLI: docker run zricethezav/gitleaks detect --source .
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-audit:
    name: Audit dipendenze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --- Node: rimuovere se il progetto non ha package.json ---
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ hashFiles('package.json') != '' }}
        with:
          # Un ramo supportato con le ultime correzioni (Node 20 è fuori supporto dal 30/04/2026).
          # Se il progetto ha .node-version o .nvmrc usare invece: node-version-file: .node-version
          node-version: '22.23.4'
      - name: npm audit
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=high
      # --- Python: rimuovere se il progetto non ha requirements ---
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ hashFiles('requirements.txt') != '' }}
        with: { python-version: '3.12' }
      - name: pip-audit
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  codeql:
    name: Analisi statica (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # solo qui: per caricare i risultati
    strategy:
      matrix:
        language: [javascript]   # aggiungere/cambiare: python, java, ecc.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
